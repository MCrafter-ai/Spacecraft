<title>SPACECRAFT</title>

<style>
:root{
  --bg:#05060f; --panel:rgba(14,19,40,.88); --line:#27315c; --line2:#3d4a86;
  --ink:#e9ecff; --dim:#8a95c6; --acc:#7c5cff; --acc2:#35d6ff; --good:#4ade80; --bad:#ff6b6b;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--ink);
  font-family:"Consolas","DejaVu Sans Mono",ui-monospace,monospace;overflow:hidden;}

#launcher{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(1100px 700px at 80% -15%, rgba(124,92,255,.26), transparent 62%),
    radial-gradient(800px 600px at 8% 115%, rgba(53,214,255,.18), transparent 60%),
    var(--bg);}
.stars{position:absolute;inset:0;pointer-events:none;}
.stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;}

/* ---- header ---- */
.lhead{padding:26px 34px 14px;text-align:center;position:relative;z-index:2;}
#logo svg{display:block;margin:0 auto;max-width:min(560px,80vw);height:auto;
  filter:drop-shadow(0 0 18px rgba(124,92,255,.55));}
.tag{margin-top:10px;color:var(--dim);font-size:12px;letter-spacing:3px;text-transform:uppercase;}

/* ---- main ---- */
.lmain{flex:1;display:flex;gap:18px;padding:8px 34px 0;min-height:0;position:relative;z-index:2;}
.lnav{width:190px;flex:none;display:flex;flex-direction:column;gap:8px;}
.nav{all:unset;cursor:pointer;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  color:var(--dim);font-size:13px;letter-spacing:2px;text-transform:uppercase;
  background:rgba(10,14,32,.6);transition:.15s;}
.nav:hover{color:var(--ink);border-color:var(--line2);}
.nav.on{color:#fff;border-color:transparent;
  background:linear-gradient(90deg,rgba(124,92,255,.85),rgba(53,214,255,.35));
  box-shadow:0 0 22px rgba(124,92,255,.35);}

.lpanel{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);
  padding:22px 24px;overflow:auto;}
.tab{display:none;} .tab.on{display:block;}
h3{margin:0 0 16px;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--acc2);font-weight:600;}
label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:0 0 6px;}
input[type=text]{width:100%;max-width:340px;background:#080b1c;border:1px solid var(--line2);border-radius:8px;
  color:var(--ink);font:inherit;font-size:15px;padding:11px 13px;outline:none;}
input[type=text]:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(53,214,255,.14);}

.row{display:flex;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid rgba(39,49,92,.6);font-size:14px;}
.row:last-of-type{border-bottom:0;}
.k{color:var(--dim);letter-spacing:1px;} .v{color:var(--ink);text-align:right;}
.note{color:var(--dim);font-size:12px;line-height:1.6;margin:16px 0 0;}
.err{color:var(--bad);font-size:12px;min-height:16px;margin-top:6px;}
.ok{color:var(--good);font-size:12px;min-height:16px;margin-top:10px;}

.btn{all:unset;cursor:pointer;display:inline-block;padding:10px 18px;border-radius:9px;font-size:12px;
  letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,var(--acc),#5b7cff);color:#fff;}
.btn:hover{filter:brightness(1.15);}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim);}
.btn.ghost:hover{color:var(--ink);border-color:var(--acc2);}
.btn.mini{padding:6px 12px;font-size:11px;}

.two{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;}
.slot{flex:1;min-width:230px;border:1px solid var(--line);border-radius:12px;padding:16px;background:rgba(8,11,28,.55);}
.slotHead{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:12px;}
.slotHead b{color:var(--ink);font-weight:600;}
canvas.prev{image-rendering:pixelated;background:
    repeating-conic-gradient(#151a33 0 25%, #0d1122 0 50%) 0 0/16px 16px;
  border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:12px;}
.chk{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;
  letter-spacing:1px;text-transform:none;margin-top:12px;}

.item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:9px;background:rgba(8,11,28,.5);font-size:13px;}
.item.sel{border-color:var(--acc2);box-shadow:0 0 0 2px rgba(53,214,255,.12) inset;}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .sz{color:var(--dim);font-size:11px;}

/* ---- footer ---- */
.lfoot{flex:none;display:flex;align-items:center;gap:20px;padding:18px 34px 24px;position:relative;z-index:2;}
.acct{flex:1;min-width:0;}
.who{font-size:15px;color:var(--ink);}
.sub{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:3px;}
#playBtn{all:unset;cursor:pointer;padding:17px 62px;border-radius:12px;font-size:19px;font-weight:700;
  letter-spacing:7px;color:#04060f;text-align:center;
  background:linear-gradient(90deg,var(--acc2),#8f7bff);
  box-shadow:0 0 34px rgba(53,214,255,.42);transition:.15s;}
#playBtn:hover{filter:brightness(1.12);box-shadow:0 0 46px rgba(53,214,255,.6);}
#playBtn.busy{opacity:.55;cursor:default;letter-spacing:3px;font-size:15px;}

@media (max-width:820px){
  .lmain{flex-direction:column;padding:8px 16px 0;}
  .lnav{width:auto;flex-direction:row;flex-wrap:wrap;}
  .lhead{padding:16px 16px 8px;} .lfoot{padding:14px 16px 18px;}
  #playBtn{padding:15px 34px;letter-spacing:4px;}
}
</style>
