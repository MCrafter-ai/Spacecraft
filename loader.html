<!DOCTYPE html>
<html><body style="margin:0;background:#000;color:#fff;font-family:sans-serif">
<p id="s" style="padding:20px">Downloading game...</p>
<script>
var BASE='https://cdn.jsdelivr.net/gh/MCrafter-ai/Spacecraft@main/';
var PARTS=['part1.txt','part2.txt','part3.txt'];
Promise.all(PARTS.map(function(p){return fetch(BASE+p).then(function(r){if(!r.ok)throw new Error(p+' '+r.status);return r.text();});}))
.then(function(a){document.open();document.write(a.join(''));document.close();})
.catch(function(e){document.getElementById('s').textContent='Failed: '+e;});
</script></body></html>
